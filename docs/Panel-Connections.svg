<ns0:text x="40" y="515" font-family="Arial, sans-serif" fill="#202b36" font-size="16">Logical connections only. Follow the exact carrier manual for sockets and power.</ns0:text><ns0:text x="40" y="545" font-family="Arial, sans-serif" fill="#202b36" font-size="13">Do not backfeed USB / join supplies. No 24 V input, CAN wiring, changer parts or C6 flashing is required.</ns0:text></ns0:svg>