<ns0:text x="40" y="48" font-family="Arial, sans-serif" fill="#202b36" font-size="26" font-weight="bold">SnapScreen XL 1.0.8 — panel-only connections</ns0:text>
<ns0:rect x="350" y="190" width="300" height="140" rx="12" fill="white" stroke="#b96314" stroke-width="2" /><ns0:text x="385" y="235" font-family="Arial, sans-serif" fill="#202b36" font-size="26" font-weight="bold">P4 touchscreen</ns0:text><ns0:text x="385" y="267" font-family="Arial, sans-serif" fill="#202b36" font-size="16">JC1060P470 XL M3/ETH</ns0:text><ns0:text x="385" y="300" font-family="Arial, sans-serif" fill="#202b36" font-size="13">Keep factory LCD/touch/C6 connections</ns0:text>
<ns0:rect x="40" y="185" width="235" height="90" rx="10" fill="white" stroke="#b96314" stroke-width="2" /><ns0:text x="60" y="219" font-family="Arial, sans-serif" fill="#202b36" font-size="16">Windows PC / P4 USB</ns0:text><ns0:text x="60" y="248" font-family="Arial, sans-serif" fill="#202b36" font-size="13">Data cable; first install only</ns0:text><ns0:path d="M275 230 H350" fill="none" stroke="#536374" stroke-width="3" />
<ns0:rect x="380" y="80" width="240" height="70" rx="10" fill="white" stroke="#b96314" stroke-width="2" /><ns0:text x="400" y="110" font-family="Arial, sans-serif" fill="#202b36" font-size="16">microSD: both free files</ns0:text><ns0:text x="400" y="135" font-family="Arial, sans-serif" fill="#202b36" font-size="13">FAT/FAT32; install 1.0.8 from SD</ns0:text><ns0:path d="M500 150 V190" fill="none" stroke="#536374" stroke-width="3" />
