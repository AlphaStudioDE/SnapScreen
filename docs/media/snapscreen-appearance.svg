<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Five SnapScreen appearance styles</title><desc id="desc">Signature, Precision, Signal, Workbench and Contrast, each available in dark and light modes</desc>
