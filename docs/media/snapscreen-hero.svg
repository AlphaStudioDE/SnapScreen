  <circle cx="1270" cy="445" r="180" fill="#22cce2" opacity="0.16" filter="url(#blur)"/>
  <g transform="translate(92 106)">
    <text x="0" y="72" fill="#f7f9fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="760" letter-spacing="-3">Snap<tspan fill="#ff742b">Screen</tspan></text>
    <text x="3" y="132" fill="#aeb8c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="450">16-color printing for Snapmaker U1</text>
    <g transform="translate(3 188)">
      <rect width="198" height="46" rx="23" fill="#ff742b"/><text x="99" y="30" fill="#101216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">16-COLOR PRINTING</text>
      <rect x="210" width="140" height="46" rx="23" fill="#1c252d" stroke="#34414c"/><text x="280" y="30" fill="#dce4ea" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">TOUCH CONTROL</text>
      <rect x="362" width="112" height="46" rx="23" fill="#1c252d" stroke="#34414c"/><text x="418" y="30" fill="#dce4ea" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">LIVE VIEW</text>
    </g>
    <text x="3" y="304" fill="#697784" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Four colors per toolhead. One seamless experience.</text>
  </g>
