    <rect x="19" y="19" width="502" height="48" rx="11" fill="#171c22"/><circle cx="45" cy="43" r="8" fill="#ff742b"/><text x="65" y="49" fill="#f1f4f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">MULTI-MATERIAL</text><text x="493" y="49" fill="#35d4e8" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">16 COLORS</text>
