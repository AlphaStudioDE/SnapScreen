      <text x="237" y="214" fill="#aeb8c2">T3</text><circle cx="290" cy="208" r="13" fill="#ff65c3"/><circle cx="330" cy="208" r="13" fill="#be5cff"/><circle cx="370" cy="208" r="13" fill="#795548"/><circle cx="410" cy="208" r="13" fill="#9ea7ae"/><path d="M448 208h42" stroke="#c884ff" stroke-width="7" stroke-linecap="round"/>
      <text x="237" y="259" fill="#aeb8c2">T4</text><circle cx="290" cy="253" r="13" fill="#ff7f32"/><circle cx="330" cy="253" r="13" fill="#b8e65c"/><circle cx="370" cy="253" r="13" fill="#65d1ff"/><circle cx="410" cy="253" r="13" fill="#30343a" stroke="#7d8790"/><path d="M448 253h42" stroke="#93d765" stroke-width="7" stroke-linecap="round"/>
